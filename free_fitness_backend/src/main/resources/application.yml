server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/free_fitness?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 4693090li
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # 生产环境用 validate，开发时可改为 update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# JWT 配置
jwt:
  secret: "FreeFitnessSecretKey2026_MustBeAtLeast256BitsLong_ChangeInProduction!"
  expiration: 86400        # access token 有效期（秒），默认 24 小时
  refresh-expiration: 604800  # refresh token 有效期（秒），默认 7 天

# 文件存储路径（头像、日记图片、餐次照片）
storage:
  upload-dir: ./uploads
  avatar-dir: ./uploads/avatars
  diary-dir: ./uploads/diary
  meal-photo-dir: ./uploads/meal-photos

# AES-256 加密密钥（敏感字段：体重、BMI）
aes:
  secret-key: "FreeFitnessAesKey2026_32BytesKey"   # 必须 32 字节，生产环境请替换

# Swagger UI 访问路径：http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.freefitness: DEBUG
    org.springframework.security: WARN
